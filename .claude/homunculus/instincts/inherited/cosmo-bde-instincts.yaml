# Cosmo Bde Workflow Add Or Update Domain Schema And Generate Types

## Action

Follow the add-or-update-domain-schema-and-generate-types workflow:
1. Edit or add specs/domain/*.schema
2. Run code generation (make regen or scripts/regen-all.sh)
3. Generated files appear in gen/domain/: *_types.c, *_types.h, *_json.c, *_json.h, *_sql.c, *_sql.h, *.proto, *.fbs
4. Commit both the updated schema and all generated files

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: specs/domain/*.schema, gen/domain/*_types.c, gen/domain/*_types.h

