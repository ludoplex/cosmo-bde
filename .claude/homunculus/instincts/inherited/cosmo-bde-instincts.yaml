# Cosmo Bde Workflow Implement New Generator Tool

## Action

Follow the implement-new-generator-tool workflow:
1. Add tool source: tools/{genname}/{genname}.c
2. Add supporting files: tools/{genname}/{genname}_self.h, {genname}_tokens.def
3. Add example spec in specs/{domain|behavior|interface|platform}/*.ext
4. Run generator to produce gen/{domain|behavior|api|platform}/* files
5. Update Makefile and/or scripts as needed
6. Commit all new/modified files

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: tools/*gen/*gen.c, tools/*gen/*gen_self.h, tools/*gen/*gen_tokens.def

