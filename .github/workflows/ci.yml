# ══════════════════════════════════════════════════════════════════════════════
# ci.yml - Main CI workflow
# ══════════════════════════════════════════════════════════════════════════════
#
# Uses shared composite action for cosmocc setup to eliminate duplication.
# See: .github/actions/setup-cosmocc/
#
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── APE Build (cosmocc) ─────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Don't use recursive submodules - some are private
        # Public submodules checked out below if needed

      - name: Setup cosmocc
        uses: ./.github/actions/setup-cosmocc

      - name: Build Ring 0 tools
        run: |
          export CC=cosmocc
          make tools

      - name: Verify no drift
        run: make verify

      - name: Build application
        run: |
          export CC=cosmocc
          make app

      - name: Build e9studio (optional)
        continue-on-error: true
        run: |
          # e9studio requires private submodule - skip if unavailable
          if [ -d vendors/submodules/e9studio/.git ]; then
            export CC=cosmocc
            make e9studio
          else
            echo "Skipping e9studio (private submodule not available)"
          fi

      - name: Run smoke test
        run: make run

      - name: Fetch pinned Cosmopolitan sources (third_party/sqlite3)
        run: make cosmo-src

      - name: Unit tests + SQLite round-trip (APE)
        run: make check

      - name: Verify APE binary
        run: |
          file build/app | grep -iE "DOS|MBR|boot"
          # livereload may not exist if e9studio was skipped
          if [ -f build/livereload ]; then
            file build/livereload | grep -iE "DOS|MBR|boot" || echo "Native binary"
          fi

  # ── Native Build (fallback) ─────────────────────────────────────────────────
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Don't use recursive submodules - some are private

      - name: Install host SQLite headers (native sql-check)
        run: sudo apt-get install -y libsqlite3-dev

      - name: Build with system cc
        run: make CC=cc tools app

      - name: Build e9studio (optional)
        continue-on-error: true
        run: |
          if [ -d vendors/submodules/e9studio/.git ]; then
            make CC=cc e9studio
          else
            echo "Skipping e9studio (private submodule not available)"
          fi

      - name: Unit tests + SQLite round-trip (native)
        run: make CC=cc check

      - name: Run tests
        run: |
          if [ -x scripts/test.sh ]; then
            CC=cc ./scripts/test.sh
          else
            echo "No test script, running smoke test"
            make CC=cc run
          fi

  # ── Manifest drift gate (manifest-kit, vendored in .github/ci-kit/) ─────────
  manifest-drift:
    name: generated manifests are reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Regenerate manifests and fail on drift
        run: sh .github/ci-kit/drift-gate.sh -C . -g 'python3 .github/ci-kit/manifest-gen.py .'
