# ══════════════════════════════════════════════════════════════════════════════
# setup-cosmocc - Composite action for cosmocc installation
# ══════════════════════════════════════════════════════════════════════════════
#
# Installs exactly the toolchain pinned in cosmocc.mk (version + sha256) with
# `make toolchain`, which runs jart's download-cosmocc.sh and refuses a zip
# whose sha256 does not match.
#
# Usage:
#   - uses: ./.github/actions/setup-cosmocc
#
# ══════════════════════════════════════════════════════════════════════════════

name: 'Setup cosmocc'
description: 'Install the pinned Cosmopolitan C toolchain (cosmocc.mk) for APE builds'

runs:
  using: 'composite'
  steps:
    - name: Cache cosmocc
      id: cache-cosmocc
      uses: actions/cache@v4
      with:
        path: .cosmocc
        key: cosmocc-${{ runner.os }}-${{ hashFiles('cosmocc.mk') }}

    - name: Install pinned cosmocc (sha256-verified)
      if: steps.cache-cosmocc.outputs.cache-hit != 'true'
      shell: bash
      run: make toolchain

    - name: Add cosmocc to PATH
      shell: bash
      run: |
        version=$(sed -n 's/^COSMOCC_VERSION := //p' cosmocc.mk)
        echo "$GITHUB_WORKSPACE/.cosmocc/$version/bin" >> "$GITHUB_PATH"
